<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout idea: tek sütunlu telefon uygulaması, altta 5 sekmeli gezinme, üstte günün başlığı ve kalan kalori. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#13212C; --muted:#5C6B77; --line:#DDE3E8;
  --accent:#0B7A87; --accent-ink:#FFFFFF; --accent-soft:#DDF0F2;
  --warm:#C94A18; --warm-soft:#FBE6DC; --good:#2E7D4F; --bar:#E6EBEF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D; --surface:#16212B; --ink:#E8EEF2; --muted:#93A3AF; --line:#26333E;
    --accent:#38B6C4; --accent-ink:#06222A; --accent-soft:#12323A;
    --warm:#F0875A; --warm-soft:#3A2418; --good:#5CC184; --bar:#243240; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161D; --surface:#16212B; --ink:#E8EEF2; --muted:#93A3AF; --line:#26333E;
  --accent:#38B6C4; --accent-ink:#06222A; --accent-soft:#12323A;
  --warm:#F0875A; --warm-soft:#3A2418; --good:#5CC184; --bar:#243240; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);min-height:100%}
.app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:22px;margin:22px 0 10px}
h3{font-size:18px}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .nav{display:flex;gap:6px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.dayhead{margin:6px 0 12px}
.dayhead h1{font-size:34px;line-height:1.05}
.dayhead .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big .num{font-family:var(--display);font-weight:700;font-size:56px;line-height:.95;font-variant-numeric:tabular-nums}
.big .lbl{color:var(--muted);font-size:14px}
.big .side{text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macro .t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.macro .t b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warm>i{background:var(--warm)}
.bar.good>i{background:var(--good)}
.meal{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:56px}
.meal .box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:16px;font-weight:700;margin-top:1px}
.meal[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.meal[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.meal .slot{font-family:var(--display);font-weight:700;font-size:17px}
.meal .txt{font-size:15px;margin-top:2px}
.meal .mac{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.meal.static{cursor:default}
.row{display:flex;gap:10px;align-items:center}
.water{display:flex;align-items:center;justify-content:space-between;gap:12px}
.water .v{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:0 16px;min-height:44px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f input,label.f select{display:block;width:100%;margin-top:4px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:500 18px var(--body);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.today{border-color:var(--accent)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ex .name{font-weight:600}
.ex .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ex .last{font-size:13px;color:var(--warm);margin-top:2px;font-variant-numeric:tabular-nums}
.ex .line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.dots{display:flex;gap:6px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--muted)}
.dot[aria-pressed="true"]{background:var(--warm);border-color:var(--warm);color:#fff}
.srow{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.srow .sn{font-weight:700;color:var(--muted);text-align:center}
.srow .lab{font-size:11px;color:var(--muted);text-align:center}
.ex .srow input{width:100%;min-width:0;text-align:center}
.srow .dot{width:46px;height:46px}
.ex .sum{font-size:13px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.pref .chips{flex-wrap:wrap;overflow:visible}
.pref input[type=text]{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:500 16px var(--body);margin-top:8px}
.mealbtn{background:none;border:0;color:var(--accent);font:600 13px var(--body);padding:0;min-height:40px;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--warm);margin-left:6px}
.warnline{font-size:12px;color:var(--warm);margin-top:4px}
.xrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.xrow:first-child{border-top:0}
.xrow .xt{font-weight:600}.xrow .xm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.xform input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:500 16px var(--body)}
.sugs{display:flex;flex-direction:column;gap:6px;margin:-2px 0 4px}
.sug{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--body);text-align:left;cursor:pointer}
.sug span{font-size:13px;color:var(--muted);white-space:nowrap}
.exbtns{display:flex;gap:18px;flex-wrap:wrap}
.how{margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.how .illus{display:block;border-radius:14px;width:100%;height:auto}
.how ol{margin:0;padding-left:20px;font-size:14px;line-height:1.5}
.how li{margin-bottom:4px}
.exbtn{background:none;border:0;color:var(--accent);font:600 13px var(--body);padding:0;min-height:36px;cursor:pointer;text-align:left}
.ex .swap{margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.ex .swap input{width:100%;text-align:left;font:500 16px var(--body)}
.ex .swap .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ex .swap .row .btn{flex:1 1 auto;min-height:44px}
.ex .orig{font-size:12px;color:var(--muted)}
.ex input{width:96px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:600 18px var(--body);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
svg text{font:12px var(--body);fill:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.shop-cat{font-family:var(--display);font-weight:700;font-size:18px;margin:16px 0 6px}
.shop{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;min-height:48px;cursor:pointer}
.shop .box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:700}
.shop[aria-pressed="true"]{opacity:.55}
.shop[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.shop[aria-pressed="true"] .nm{text-decoration:line-through}
.shop .nm{flex:1;font-size:15px}
.shop .q{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.status.err{color:var(--warm)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.bar>i{transition:width .25s ease}}

.hero{padding:28px 0 8px}
.hero h1{font-size:52px;line-height:1}
.hero p{font-size:17px;color:var(--muted);margin:12px 0 0;max-width:34ch}
.feat{display:flex;gap:14px;align-items:flex-start;margin:18px 0}
.feat .ic{flex:0 0 44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.feat .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feat b{display:block;font-family:var(--display);font-size:20px}
.feat span{color:var(--muted);font-size:15px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:52px;cursor:pointer}
.opt b{display:block;font-weight:600}
.opt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:8px}
.seg .opt{text-align:center;margin:0}
.steps{display:flex;gap:6px;margin:6px 0 14px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--bar)}
.steps i.on{background:var(--accent)}
.err{background:var(--warm-soft);color:var(--warm);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.check{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-size:14px}
.check .box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:700}
.check[aria-pressed="true"]{border-color:var(--accent)}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field-title{font-family:var(--display);font-weight:700;font-size:18px;margin:16px 0 8px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1;min-height:52px}
.sched td:last-child{text-align:left;padding-left:12px}

.prof{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.prof h1{font-size:30px;line-height:1.05}
.avatar{flex:0 0 64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:32px}
.ach{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ach .medal{flex:0 0 44px;height:44px;border-radius:12px;background:var(--bar);color:var(--muted);display:grid;place-items:center}
.ach .medal svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ach .body{flex:1;min-width:0}
.ach b{display:block;font-weight:600}
.ach span{display:block;font-size:13px;color:var(--muted)}
.ach.done{border-color:var(--accent);background:var(--accent-soft)}
.ach.done .medal{background:var(--accent);color:var(--accent-ink)}
.ach .got{font-size:12px;font-weight:700;color:var(--accent);margin-top:4px}

#modal .back{position:fixed;inset:0;background:rgba(10,20,28,.6);display:grid;place-items:center;padding:20px;z-index:50}
.pop{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 22px 20px;max-width:360px;width:100%;text-align:center}
.pop .badge{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative}
.pop .badge svg{width:54px;height:54px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pop .kicker{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.pop h2{font-size:30px;margin:4px 0 6px}
.pop p{margin:0 0 14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
  .pop .badge::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--accent);opacity:0;animation:ring 1.3s .25s ease-out 2}
  @keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes ring{from{transform:scale(.92);opacity:.85}to{transform:scale(1.4);opacity:0}}
}
</style>
</head>
<body>
<div class="app">
  <main id="view" aria-live="polite"></main>
  <div id="status" class="status"></div>
</div>
<nav class="tabbar" aria-label="Sekmeler"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>

function buildPlan(p){
  const male = p.sex === 'e';
  const bmr = 10*p.kilo + 6.25*p.boy - 5*p.yas + (male ? 5 : -161);
  const tdee = bmr * p.akt;
  const bmi = p.kilo / Math.pow(p.boy/100, 2);
  const notes = [];
  let delta = 0;
  if(p.goal === 'fatmuscle') delta = -clamp(tdee*0.17, 250, 650);
  else if(p.goal === 'fat') delta = -clamp(tdee*0.20, 300, 750);
  else if(p.goal === 'muscle') delta = clamp(tdee*0.10, 200, 400);
  if(bmi < 18.5 && delta < 0){
    delta = 0;
    notes.push('Kilon düşük aralıkta göründüğü için kalori açığı verilmedi. Kilo vermeden önce bir doktora ya da diyetisyene danış.');
  }
  let kcal = Math.round(tdee + delta);
  const floor = male ? 1500 : 1200;
  if(kcal < floor){ kcal = floor; delta = floor - tdee; notes.push('Güvenli alt sınır olan '+floor+' kcal uygulandı. Daha düşük kalori önermiyoruz.'); }
  const refW = Math.min(p.kilo, 30*Math.pow(p.boy/100, 2));
  const pk = p.goal === 'muscle' ? 1.8 : p.goal === 'maintain' ? 1.6 : 1.7;
  const protein = Math.round(refW*pk);
  const fat = Math.round(kcal*0.28/9);
  const carb = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  const water = Math.round(0.03*p.kilo*10)/10;
  const mult0 = clamp(kcal/BASE_KCAL, 0.6, 1.45);
  const mult = Math.abs(mult0-1) < 0.04 ? 1 : mult0;
  const weekly = delta*7/7700; // kg/hafta (eksi = kilo kaybı)
  if(p.goal === 'muscle') notes.push('Kas kazanırken kilonun yavaş yükselmesi normaldir. Haftada 0,25-0,5 kg artıştan fazlaysa kaloriyi biraz azalt.');
  if(p.goal === 'fatmuscle' || p.goal === 'fat') notes.push('4-6 hafta sonra kilo ve bel çevresi hiç düşmediyse günlük kaloriyi 100-150 kcal azalt; haftada 1 kg\'dan hızlı kayıp varsa artır.');
  if(p.exp === 'new') notes.push('Yeni başlıyorsan ilk 2-3 hafta ağırlıkları hafif tut, formu oturt; her sette bitirmeye 2-3 tekrar kala bırak.');
  return {kcal, protein, fat, carb, water, delta, mult, weekly, bmi, tdee, notes};
}
function scaleText(t, m){
  if(Math.abs(m-1) < 0.04) return t;
  return t.replace(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/g, (s,n,u)=>{
    let v = parseFloat(n.replace(',','.'))*m; const st = v >= 100 ? 10 : 5;
    v = Math.max(st, Math.round(v/st)*st); return v+' '+u;
  }).replace(/\b(\d+)\s+(yumurta|dilim)/g, (s,n,w)=>Math.max(1, Math.round(Number(n)*m))+' '+w);
}

const trKey = t => String(t||'').toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const FOODKEYS = FOODS.map(f=>trKey(f[0]+' '+f[1]));
function foodFind(q){
  const w = trKey(q).split(' ').filter(Boolean); if(!w.length) return [];
  const out = [];
  FOODKEYS.forEach((k,i)=>{ const tk = k.split(' '); if(w.every(x=>tk.some(t=>t.indexOf(x)===0))){ const name = trKey(FOODS[i][0]); out.push({i, sc: name.indexOf(w[0])===0 ? 0 : (name.indexOf(w[0])>0 ? 1 : 2)}); } });
  out.sort((a,b)=>a.sc-b.sc || a.i-b.i);
  return out.slice(0,6).map(x=>x.i);
}

  {k:'dairy', t:'Süt ürünleri', ing:['Süzme / az yağlı yoğurt','Süt (yarım yağlı)','Beyaz peynir','Lor peyniri','Whey protein'], words:['yoğurt','peynir','süt','lor','cacık','whey','ayran']},
  {k:'gluten', t:'Gluten (ekmek, bulgur…)', ing:['Yulaf','Tam buğday ekmeği','Bulgur (kuru)','Makarna (kuru)'], words:['ekmek','bulgur','makarna','yulaf','tost']},
  {k:'nuts', t:'Kuruyemiş / fıstık', ing:['Ceviz','Badem','Fıstık ezmesi'], words:['ceviz','badem','fıstık','kuruyemiş']},
  {k:'fish', t:'Balık', ing:['Somon','Levrek/çipura (bütün)','Ton balığı (konserve, süzülmüş)'], words:['somon','levrek','çipura','ton balığı','balık']},
  {k:'chicken', t:'Tavuk / hindi', ing:['Tavuk göğsü (çiğ)','Tavuk but, derisiz (çiğ)','Hindi göğsü (çiğ)'], words:['tavuk','hindi']},
  {k:'beef', t:'Dana eti', ing:['Yağsız dana eti (çiğ)','Yağsız dana kıyma'], words:['dana','kıyma']},
  {k:'legume', t:'Baklagil', ing:['Kırmızı mercimek (kuru)','Kuru fasulye (kuru)','Nohut (kuru)'], words:['mercimek','fasulye','nohut']}
];
const MEAT_ING = ['Tavuk göğsü (çiğ)','Tavuk but, derisiz (çiğ)','Hindi göğsü (çiğ)','Yağsız dana eti (çiğ)','Yağsız dana kıyma','Somon','Levrek/çipura (bütün)','Ton balığı (konserve, süzülmüş)'];
const lc = t => String(t||'').toLocaleLowerCase('tr-TR');
function avoidHits(src, p){
  const hits = [], ing = Object.keys(src.ing||{}), txt = lc(src.text);
  (p.avoid||[]).forEach(k=>{
    const g = AVOID.find(x=>x.k===k); if(!g) return;
    if(ing.some(n=>g.ing.indexOf(n)>=0) || g.words.some(w=>txt.indexOf(w)>=0)) hits.push(g.t);
  });
  String(p.avoidText||'').split(/[,;\n]/).map(x=>lc(x).trim()).filter(x=>x.length>=2).forEach(w=>{
    if(txt.indexOf(w)>=0 || ing.some(n=>lc(n).indexOf(w)>=0)) hits.push(w);
  });
  return hits;
}
function mealPool(slot, p){
  const out = [], seen = {};
  const add = m => { if(!m || seen[m.text]) return; if(p.diet==='veg' && Object.keys(m.ing||{}).some(n=>MEAT_ING.indexOf(n)>=0)) return; seen[m.text]=1; out.push(Object.assign({slot}, m)); };
  DATA.days.forEach(d=>d.meals.forEach(m=>{ if(m.slot===slot && !m.free) add(m); }));
  EXTRA.forEach(m=>{ if(m.slot===slot) add(m); });
  if(slot==='Öğle') DATA.veg.lunch.forEach(add);
  if(slot==='Akşam') DATA.veg.dinner.forEach(add);
  return out;
}
function mealCands(src, p){
  const okOrig = avoidHits(src, p).length === 0;
  const alts = mealPool(src.slot, p).filter(m=>m.text!==src.text && avoidHits(m,p).length===0)
    .sort((a,b)=> (Math.abs(a.kcal-src.kcal)+2*Math.abs(a.p-src.p)) - (Math.abs(b.kcal-src.kcal)+2*Math.abs(b.p-src.p)));
  return {okOrig, list: okOrig ? [src].concat(alts) : alts};
}
function buildMenu(p, plan){
  const m = plan.mult;
  return DATA.days.map((d,di)=>({
    name:d.name,
    meals:d.meals.map((meal,mi)=>{
      let src = meal;
      if(p.diet === 'veg' && !meal.free){
        if(mi === 2) src = Object.assign({slot:meal.slot}, DATA.veg.lunch[di%4]);
        if(mi === 4) src = Object.assign({slot:meal.slot}, DATA.veg.dinner[(di+1)%4]);
      }
      let idx = 0, nAlt = 1, warn = null, changed = false;
      const key = di+'_'+mi;
      if(!meal.free){
        const cs = mealCands(src, p), n = cs.list.length;
        if(n){
          const pk = p.mealPick && p.mealPick[key];
          idx = (pk===undefined || pk===null) ? (cs.okOrig ? 0 : di % Math.min(3,n)) : (pk % n);
          nAlt = n; changed = cs.list[idx].text !== src.text; src = cs.list[idx];
        } else { warn = avoidHits(src, p); }
      }
      return {slot:meal.slot, text:scaleText(src.text, m), kcal:Math.round(src.kcal*m), p:Math.round(src.p*m), c:Math.round(src.c*m), f:Math.round(src.f*m), ing:src.ing||{}, free:!!meal.free, key, idx, nAlt, changed, warn};
    })
  }));
}
function trainInfo(p, di){
  const idx = SCHED[p.gun].indexOf(di);
  if(idx >= 0) return {idx, name:PROGRAMS[p.gun][idx].name, train:true};
  return {idx:-1, name: di===5 ? 'Hafif kardiyo (30-40 dk)' : 'Dinlenme + yürüyüş', train:false};
}
function trainFor(d){
  const day = state.days[d], p = P();
  if(day && day.plan !== undefined){
    if(day.plan >= 0 && day.plan < PROGRAMS[p.gun].length) return {idx:day.plan, name:PROGRAMS[p.gun][day.plan].name, train:true, manual:true};
    return {idx:-1, name:'Dinlenme', train:false, manual:true};
  }
  const t = trainInfo(p, dow(d)); t.manual = false; return t;
}
function pickerHtml(d){
  const day = state.days[d] || {}, p = P();
  const cur = day.plan === undefined ? 'auto' : String(day.plan);
  const chip = (v, label) => `<button class="chip" data-act="setplan" data-v="${v}" aria-pressed="${cur===String(v)}">${esc(label)}</button>`;
  return `<div class="card" style="margin-top:10px"><div class="hint" style="margin-bottom:8px">Bu günün antrenmanını seç. "Otomatik" haftalık düzene döner.</div>
    <div class="chips" style="flex-wrap:wrap;overflow:visible">${chip('auto','Otomatik')}${PROGRAMS[p.gun].map((w,i)=>chip(i,w.name)).join('')}${chip(-1,'Dinlenme')}</div>
    <button class="btn ghost" style="width:100%" data-act="swap">Yarınla yer değiştir</button></div>`;
}
function hashStr(t){ let h=5381; for(let i=0;i<t.length;i++) h=((h*33)^t.charCodeAt(i))>>>0; return h.toString(36); }
function workoutFor(p, idx){
  return PROGRAMS[p.gun][idx].ex.map((e,i)=>{
    const sets = p.exp === 'new' ? Math.min(e.sets,3) : e.sets;
    const slot = 'p'+p.gun+'w'+idx+'e'+i+'_'+(p.yer==='home'?'h':'g');
    const o = {id:slot, slot, key:e.key, name:EX[e.key][p.yer==='home'?'h':'g'], sets, reps:e.reps, rest:e.rest};
    const sw = p.swaps && p.swaps[slot];
    if(sw){ o.orig = o.name; o.name = sw; o.id = slot+'~'+hashStr(sw.toLocaleLowerCase('tr-TR')); o.swapped = true; }
    return o;
  });
}
const CAT_ORDER = ['Protein','Süt ürünü','Takviye','Karbonhidrat','Bakliyat','Meyve','Sebze','Yağ','Diğer'];
function buildShop(menu, mult){
  const tot = {};
  menu.forEach(d=>d.meals.forEach(m=>{ if(m.free) return; Object.keys(m.ing).forEach(k=>{ tot[k] = (tot[k]||0) + m.ing[k]*mult; }); }));
  const names = Object.keys(DATA.items);
  const rows = Object.keys(tot).map(name=>{
    const [cat,unit] = DATA.items[name]; let q = tot[name]*1.1;
    if(unit === 'g') q = Math.ceil(q/(q<1000?50:100))*(q<1000?50:100);
    else if(unit === 'ml') q = Math.ceil(q/100)*100;
    else q = Math.ceil(q);
    return {cat, name, unit, qty:q};
  });
  rows.sort((a,b)=> CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat) || names.indexOf(a.name)-names.indexOf(b.name));
  return rows;
}
function refreshPlan(){
  if(!onboarded()){ PLAN = null; return; }
  const p = P();
  const plan = buildPlan(p);
  const menu = buildMenu(p, plan);
  PLAN = {t:plan, menu, shop:buildShop(menu, plan.mult)};
}

/* ---------- saklama (bulut + yerel yedek) ---------- */
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const o = JSON.parse(raw); state.days = o.days||{}; state.profile = o.profile||{}; }
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({days:state.days, profile:state.profile})); }catch(e){}
}
const queue = {};
function docBody(key){ return key === 'profile' ? state.profile : (state.days[key.slice(2)] || {}); }
function persist(key){
  saveLocal();
  if(!col) return;
  const s = queue[key] || (queue[key] = {timer:null, inflight:false, dirty:false});
  s.dirty = true;
  clearTimeout(s.timer);
  s.timer = setTimeout(()=>flush(key), 500);
}
async function flush(key){
  const s = queue[key];
  if(!s || s.inflight || !s.dirty || !col) return;
  s.inflight = true; s.dirty = false;
  try{
    await col.doc(key).set(JSON.parse(JSON.stringify(docBody(key))));
    setStatus('Kaydedildi', false);
  }catch(e){
    if(e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')){
      col = null;
      setStatus('Bu bağlantıyla buluta kayıt yapılamıyor; veriler yalnızca bu tarayıcıda saklanıyor.', true);
    } else {
      setStatus('Buluta kaydedilemedi, değişiklikler bu cihazda duruyor.', true);
    }
  }
  s.inflight = false;
  if(s.dirty) flush(key);
}
function setStatus(msg, err){
  statusMsg = msg; statusErr = !!err;
  const el = document.getElementById('status');
  if(el){ el.textContent = msg; el.className = 'status' + (err ? ' err' : ''); }
}
function isBusy(key){ const s = queue[key]; return !!(s && (s.dirty || s.inflight)); }

async function initCloud(){
  initSample();
  const timer = setTimeout(()=>{ if(!firstSnap) setStatus('Buluta ulaşılamıyor, veriler bu cihazda tutuluyor.', true); }, 10000);
  try{
    const db = await claude.use('db');
    const user = await claude.use('user');
    const uid = user ? await user.id() : null;
    if(!db || !uid){ clearTimeout(timer); setStatus('Veriler yalnızca bu tarayıcıda saklanıyor.', false); return; }
    col = db.collection('data/users/'+uid);
    col.onSnapshot(snap=>{
      firstSnap = true; clearTimeout(timer);
      const remoteDays = {}; let remoteProfile = null; let any = false;
      snap.docs.forEach(d=>{
        any = true;
        if(d.id === 'profile') remoteProfile = d.data();
        else if(d.id.startsWith('d_')) remoteDays[d.id.slice(2)] = d.data();
      });
      if(!any && (Object.keys(state.days).length || Object.keys(state.profile).length)){
        Object.keys(state.days).forEach(k=>persist('d_'+k));
        if(Object.keys(state.profile).length) persist('profile');
      } else {
        Object.keys(remoteDays).forEach(k=>{ if(!isBusy('d_'+k)) state.days[k] = remoteDays[k]; });
        if(remoteProfile && !isBusy('profile')) state.profile = remoteProfile;
        saveLocal();
      }
      if(!statusErr) setStatus('Veriler hesabına özel olarak kaydediliyor.', false);
      if(screen === 'welcome' && onboarded()) screen = null;
      if(!screen && !onboarded()) screen = 'welcome';
      refreshPlan();
      checkAch(true);
      render();
    }, err=>{
      clearTimeout(timer); col = null;
      setStatus('Bulut bağlantısı kapandı, veriler bu cihazda tutuluyor.', true);
    });
  }catch(e){
    clearTimeout(timer);
    setStatus('Veriler yalnızca bu tarayıcıda saklanıyor.', false);
  }
}

function dayTotals(d){
  const plan = PLAN.menu[dow(d)];
  const eaten = getDay(d).meals || {};
  let k=0,p=0,c=0,f=0;
  plan.meals.forEach((m,i)=>{ if(eaten[i]){ k+=m.kcal; p+=m.p; c+=m.c; f+=m.f; } });
  let xk = 0;
  (getDay(d).extra||[]).forEach(x=>{ k+=x.k||0; p+=x.p||0; c+=x.c||0; f+=x.f||0; xk+=x.k||0; });
  return {k,p,c,f,xk};
}

function getSets(rec, n){
  const out = [];
  for(let i=0;i<n;i++){
    if(rec.s && rec.s[i]) out.push(rec.s[i]);
    else if(!rec.s && rec.sets>i) out.push({kg:rec.kg, ok:true});
    else out.push({});
  }
  return out;
}
function setRec(ex, n){
  const d = touchDay(); d.lifts = d.lifts || {};
  const r = d.lifts[ex] = d.lifts[ex] || {};
  if(!r.s) r.s = getSets(r, n);
  while(r.s.length<n) r.s.push({});
  return r;
}
function syncLift(r){
  const ok = (r.s||[]).filter(x=>x && x.ok);
  r.sets = ok.length;
  const ks = (r.s||[]).filter(x=>x && x.kg>0 && (x.ok || x.r>0)).map(x=>x.kg);
  if(ks.length) r.kg = Math.max.apply(null, ks); else delete r.kg;
}
function onSetField(el, final){
  const r = setRec(el.dataset.ex, Number(el.dataset.tot));
  const s = r.s[Number(el.dataset.i)], key = el.dataset.field==='sk' ? 'kg' : 'r';
  const v = num(el.value);
  if(v==null) delete s[key]; else s[key] = v;
  if(final && s.kg>0 && s.r>0) s.ok = true;
  syncLift(r);
  persist('d_'+date);
  if(final){ el.blur(); checkAch(); render(); }
}
function lastLift(exId, before){
  const ds = Object.keys(state.days).filter(x=>x<before && state.days[x].lifts && state.days[x].lifts[exId] && state.days[x].lifts[exId].kg>0).sort();
  if(!ds.length) return null;
  const x = ds[ds.length-1];
  return {kg: state.days[x].lifts[exId].kg, d: x};
}

function chartSvg(pts, p, perDay){
  const W=340,H=190,L=38,R=12,T=14,B=26;
  const start = p.start;
  const span = Math.max(28, ...pts.map(x=>diffDays(x.d,start)));
  const planEnd = p.kilo - perDay*span;
  const ws = pts.map(x=>x.w).concat([p.kilo, planEnd]);
  let lo = Math.floor(Math.min(...ws)-1), hi = Math.ceil(Math.max(...ws)+1);
  if(hi-lo<4) hi = lo+4;
  const X = d => L + (diffDays(d,start)/span)*(W-L-R);
  const Y = w => T + (1-(w-lo)/(hi-lo))*(H-T-B);
  let g = '';
  for(let i=0;i<=3;i++){
    const v = lo + (hi-lo)*i/3, y = Y(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end">${nf0.format(v)}</text>`;
  }
  const plan = `<line x1="${X(start)}" y1="${Y(p.kilo)}" x2="${X(addDays(start,span))}" y2="${Y(planEnd)}" stroke="var(--warm)" stroke-width="2" stroke-dasharray="5 5"/>`;
  const line = pts.length>1 ? `<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(x=>X(x.d)+','+Y(x.w)).join(' ')}"/>` : '';
  const dots = pts.map((x,i)=>`<circle cx="${X(x.d)}" cy="${Y(x.w)}" r="${i===pts.length-1?5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const lastP = pts[pts.length-1];
  const lbl = `<text x="${Math.min(X(lastP.d), W-R-24)}" y="${Y(lastP.w)-10}" style="fill:var(--ink);font-weight:600">${nf1.format(lastP.w)}</text>`;
  const sd = parse(start), ed = parse(addDays(start,span));
  const xl = `<text x="${L}" y="${H-6}">${sd.getDate()} ${AY[sd.getMonth()].slice(0,3)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${ed.getDate()} ${AY[ed.getMonth()].slice(0,3)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kilo grafiği, kilogram">${g}${plan}${line}${dots}${lbl}${xl}</svg>`;
}
function viewIlerleme(){
  const p = P(), t = PLAN.t;
  const keys = Object.keys(state.days).filter(k=>k>=p.start).sort();
  const wts = keys.filter(k=>state.days[k].weight>0).map(k=>({d:k,w:state.days[k].weight}));
  const pts = wts.slice();
  if(!pts.some(x=>x.d===p.start)) pts.unshift({d:p.start,w:p.kilo});
  const first = pts[0].w, last = pts[pts.length-1].w;
  const waists = keys.filter(k=>state.days[k].waist>0).map(k=>state.days[k].waist);
  const perDay = -t.delta/7700;
  const sg = v => (v>0?'+':'')+nf1.format(v);
  let h = `<div class="dayhead"><h1>İlerleme</h1><div class="sub">Başlangıç: ${parse(p.start).getDate()} ${AY[parse(p.start).getMonth()]}</div></div>`;

  h += `<div class="tiles" style="margin-top:12px">
    <div class="tile"><div class="k">Başlangıç</div><div class="n">${nf1.format(first)} kg</div></div>
    <div class="tile"><div class="k">Son kilo</div><div class="n">${nf1.format(last)} kg</div></div>
    <div class="tile"><div class="k">Fark</div><div class="n">${sg(last-first)} kg</div></div>
    <div class="tile"><div class="k">İlk bel</div><div class="n">${waists.length?nf1.format(waists[0])+' cm':'-'}</div></div>
    <div class="tile"><div class="k">Son bel</div><div class="n">${waists.length?nf1.format(waists[waists.length-1])+' cm':'-'}</div></div>
    <div class="tile"><div class="k">Bel farkı</div><div class="n">${waists.length>1?sg(waists[waists.length-1]-waists[0])+' cm':'-'}</div></div></div>`;
  if(p.hedefKilo){
    const left = p.hedefKilo - last;
    const wkRate = Math.abs(t.weekly);
    const eta = (wkRate>0.05 && left*t.weekly>0) ? Math.ceil(Math.abs(left)/wkRate) : null;
    h += `<div class="tiles" style="margin-top:8px">
      <div class="tile"><div class="k">Hedef kilo</div><div class="n">${nf1.format(p.hedefKilo)} kg</div></div>
      <div class="tile"><div class="k">Kalan</div><div class="n">${sg(left)} kg</div></div>
      <div class="tile"><div class="k">Tahmini süre</div><div class="n">${eta?eta+' hf':'-'}</div></div></div>`;
  }
  h += `<h2>Kilo grafiği</h2><section class="card">${chartSvg(pts,p,perDay)}<div class="hint">Mavi çizgi gerçek kilon. Kesikli turuncu çizgi hedefindeki tahmini seyir (haftada yaklaşık ${nf2.format(Math.abs(t.weekly))} kg ${t.weekly<0?'azalış':(t.weekly>0?'artış':'değişim')}).</div></section>`;
  const curWeek = Math.floor(diffDays(TODAY,p.start)/7);
  let rows = '';
  for(let w=0; w<=Math.max(0,Math.min(11,curWeek)); w++){
    const a = addDays(p.start,w*7), b = addDays(p.start,w*7+7);
    const ds = keys.filter(k=>k>=a && k<b);
    const ws = ds.map(k=>state.days[k].weight).filter(x=>x>0);
    const bs = ds.map(k=>state.days[k].waist).filter(x=>x>0);
    const avg = arr => arr.reduce((s,x)=>s+x,0)/arr.length;
    rows += `<tr><td>${w+1}. hafta</td><td>${ws.length?nf1.format(avg(ws)):'-'}</td><td>${ws.length?sg(avg(ws)-p.kilo):'-'}</td><td>${bs.length?nf1.format(avg(bs)):'-'}</td></tr>`;
  }
  h += `<h2>Haftalık ortalamalar</h2><section class="card scroll"><table><thead><tr><th>Hafta</th><th>Ort. kilo</th><th>Başlangıca göre</th><th>Ort. bel</th></tr></thead><tbody>${rows}</tbody></table></section>`;
  return h;
}


function liftDone(x){ return !!(x.lifts && Object.keys(x.lifts).some(k=>(x.lifts[k].sets>0)||(x.lifts[k].kg>0))); }
function dayActive(d){
  const x = state.days[d]; if(!x) return false;
  return (x.weight>0) || (x.water>0) || !!(x.meals && Object.keys(x.meals).length) || liftDone(x);
}
function stats(){
  const p = P(), t = PLAN.t;
  const keys = Object.keys(state.days).filter(k=>k>=p.start && k<=TODAY).sort();
  let workouts=0, sets=0, waterDays=0, protDays=0, kcalDays=0, logged=0;
  keys.forEach(k=>{
    const x = state.days[k];
    if(dayActive(k)) logged++;
    if(liftDone(x)){ workouts++; Object.keys(x.lifts).forEach(i=>{ sets += x.lifts[i].sets||0; }); }
    if((x.water||0) >= t.water*1000) waterDays++;
    const n = x.meals ? Object.keys(x.meals).length : 0, tot = dayTotals(k);
    if(n>=4 && tot.k>=t.kcal*0.9 && tot.k<=t.kcal*1.1) kcalDays++;
    if(n>=4 && tot.p>=t.protein*0.9) protDays++;
  });
  let volume = 0, prs = 0; const best = {};
  keys.forEach(k=>{
    const L = state.days[k].lifts; if(!L) return;
    Object.keys(L).forEach(id=>{
      const r = L[id];
      (r.s||[]).forEach(x=>{ if(x && x.ok && x.kg>0 && x.r>0) volume += x.kg*x.r; });
      if(r.kg>0 && (r.sets>0 || (r.s||[]).some(x=>x&&x.ok))){
        if(best[id]>0 && r.kg>best[id]) prs++;
        if(!(best[id]>=r.kg)) best[id] = r.kg;
      }
    });
  });
  let streak = 0, d = dayActive(TODAY) ? TODAY : addDays(TODAY,-1);
  while(d>=p.start && dayActive(d)){ streak++; d = addDays(d,-1); }
  const wts = keys.filter(k=>state.days[k].weight>0).map(k=>state.days[k].weight);
  const last = wts.length ? wts[wts.length-1] : p.kilo;
  const waists = keys.filter(k=>state.days[k].waist>0).map(k=>state.days[k].waist);
  const waistLoss = waists.length>1 ? waists[0]-waists[waists.length-1] : 0;
  const loss = p.goal==='fat' || p.goal==='fatmuscle';
  const progressKg = loss ? p.kilo-last : (p.goal==='muscle' ? last-p.kilo : 0);
  let stableWeeks = 0;
  for(let w=0; w<12; w++){
    const a = addDays(p.start,w*7), b = addDays(p.start,w*7+7);
    const ws = keys.filter(k=>k>=a && k<b && state.days[k].weight>0).map(k=>state.days[k].weight);
    if(ws.length && Math.abs(ws.reduce((s,x)=>s+x,0)/ws.length - p.kilo) <= 1) stableWeeks++;
  }
  return {volume, prs, keys, workouts, sets, waterDays, protDays, kcalDays, logged, streak, last, waistLoss, loss, progressKg, stableWeeks};
}

function weekSummary(){
  const p = P(), t = PLAN.t;
  const end = TODAY, startW = addDays(end,-6);
  const from = startW < p.start ? p.start : startW;
  const n = diffDays(end,from)+1;
  const prevTo = addDays(from,-1), prevFrom = addDays(from,-7);
  const inR = (k,a,b)=> k>=a && k<=b;
  const keys = Object.keys(state.days);
  const avg = arr => arr.length ? arr.reduce((s,x)=>s+x,0)/arr.length : null;
  const w1 = avg(keys.filter(k=>inR(k,from,end) && state.days[k].weight>0).map(k=>state.days[k].weight));
  const w0 = (prevFrom>=p.start) ? avg(keys.filter(k=>inR(k,prevFrom,prevTo) && state.days[k].weight>0).map(k=>state.days[k].weight)) : null;
  const b1 = keys.filter(k=>inR(k,from,end) && state.days[k].waist>0).sort().map(k=>state.days[k].waist);
  let planned=0, done=0, kcalD=0, protD=0, waterD=0, logged=0;
  for(let i=0;i<n;i++){
    const d = addDays(from,i), x = state.days[d];
    const ti = trainFor(d);
    if(ti && ti.train) planned++;
    if(!x) continue;
    if(dayActive(d)) logged++;
    if(liftDone(x)) done++;
    if((x.water||0) >= t.water*1000) waterD++;
    const c = x.meals ? Object.keys(x.meals).length : 0, tot = dayTotals(d);
    if(c>=4 && tot.k>=t.kcal*0.9 && tot.k<=t.kcal*1.1) kcalD++;
    if(c>=4 && tot.p>=t.protein*0.9) protD++;
  }
  return {from, n, w1, w0, waistDelta: b1.length>1 ? b1[b1.length-1]-b1[0] : null, planned, done, kcalD, protD, waterD, logged};
}
function weekCard(){
  const s = weekSummary(), st = stats();
  const sg = v => (v>0?'+':'')+nf1.format(v);
  const fd = d => parse(d).getDate()+' '+AY[parse(d).getMonth()].slice(0,3);
  let msg;
  if(s.logged===0) msg = 'Bu hafta henüz kayıt yok. Bugün tek bir öğün ya da su kaydı bile seriyi başlatır.';
  else if(s.planned>0 && s.done>=s.planned) msg = 'Planlanan tüm antrenmanları yaptın. Düzenli gidiyorsun.';
  else if(s.planned>0 && s.done>0) msg = 'Antrenmanların '+s.done+'/'+s.planned+' tamamlandı. Kaçırdığın günü Antrenman sekmesinden yarına kaydırabilirsin.';
  else if(s.planned>0) msg = 'Planda '+s.planned+' antrenman var, henüz kayıt girilmedi.';
  else msg = 'Bu hafta planlı antrenman günü yok, toparlanma haftası.';
  const wTxt = s.w1==null ? '-' : nf1.format(s.w1)+' kg';
  const wDiff = (s.w1!=null && s.w0!=null) ? sg(s.w1-s.w0)+' kg' : '-';
  return `<h2>Haftalık özet</h2><section class="card"><div class="hint" style="margin:0 0 10px">${fd(s.from)} – ${fd(TODAY)} (${s.n} gün)</div>
    <div class="tiles">
      <div class="tile"><div class="k">Antrenman</div><div class="n">${s.done}/${s.planned}</div></div>
      <div class="tile"><div class="k">Ort. kilo</div><div class="n">${wTxt}</div></div>
      <div class="tile"><div class="k">Önceki haftaya göre</div><div class="n">${wDiff}</div></div>
      <div class="tile"><div class="k">Kalori hedefi</div><div class="n">${s.kcalD}/${s.n} gün</div></div>
      <div class="tile"><div class="k">Protein hedefi</div><div class="n">${s.protD}/${s.n} gün</div></div>
      <div class="tile"><div class="k">Su hedefi</div><div class="n">${s.waterD}/${s.n} gün</div></div>
      <div class="tile"><div class="k">Seri</div><div class="n">${st.streak} gün</div></div>
      <div class="tile"><div class="k">Bel değişimi</div><div class="n">${s.waistDelta==null?'-':sg(s.waistDelta)+' cm'}</div></div></div>
    <div class="hint" style="margin-top:10px">${msg}</div></section>`;
}
function achievements(st){
  const p = P(), list = [];
  const add = (grp, title, desc, val, target, unit) => list.push({grp, title, desc, val:Math.max(0,Math.min(val,target)), target, unit:unit||'', done:val>=target});
  if(p.goal==='fat' || p.goal==='fatmuscle') [1,2,5,10,15,20].forEach(m=>add('Kilo', m+' kg verdin', 'Başlangıca göre toplam '+m+' kg', st.progressKg, m, ' kg'));
  else if(p.goal==='muscle') [1,2,3,5].forEach(m=>add('Kilo', m+' kg aldın', 'Başlangıca göre toplam '+m+' kg artış', st.progressKg, m, ' kg'));
  else [2,4,8].forEach(m=>add('Kilo', m+' hafta dengede', 'Haftalık ortalama kilon başlangıcın ±1 kg içinde', st.stableWeeks, m, ' hf'));
  if(p.hedefKilo && Math.abs(p.hedefKilo-p.kilo)>=1){
    const total = Math.abs(p.hedefKilo-p.kilo), got = Math.max(0, (p.hedefKilo>p.kilo ? st.last-p.kilo : p.kilo-st.last));
    const pc = Math.min(100, got/total*100);
    [25,50,75,100].forEach(m=>add('Kilo', m===100?'Hedef kiloya ulaştın':'Hedefin %'+m+'\'i', 'Hedef kilo '+nf1.format(p.hedefKilo)+' kg', pc, m, '%'));
  }
  [2,5,10].forEach(m=>add('Kilo', 'Bel '+m+' cm küçüldü', 'Bel çevresi ölçümlerine göre', st.waistLoss, m, ' cm'));
  [3,7,14,30].forEach(m=>add('Düzen', m+' gün üst üste', 'Her gün en az bir kayıt (öğün, su, kilo ya da antrenman)', st.streak, m, ' gün'));
  [1,5,12,25,50].forEach(m=>add('Antrenman', m===1?'İlk antrenman':m+' antrenman', 'Ağırlık ya da set kaydı girilen günler', st.workouts, m, ''));
  [1,5,10].forEach(m=>add('Antrenman', m===1?'İlk rekor':m+' rekor', 'Bir egzersizde önceki en yüksek ağırlığını aştığın günler', st.prs, m, ''));
  [1000,10000,50000].forEach(m=>add('Antrenman', nf0.format(m)+' kg hacim', 'Tamamlanan setlerde kg × tekrar toplamı', st.volume, m, ' kg'));
  [7,14,30].forEach(m=>add('Beslenme', m+' gün kalori hedefi', 'En az 4 öğün işaretli ve hedefin %90-110\'u', st.kcalDays, m, ' gün'));
  [7,14,30].forEach(m=>add('Beslenme', m+' gün protein hedefi', 'En az 4 öğün işaretli ve hedefin en az %90\'ı', st.protDays, m, ' gün'));
  [7,14,30].forEach(m=>add('Beslenme', m+' gün su hedefi', 'Günlük su hedefine ulaştığın günler', st.waterDays, m, ' gün'));
  return list;
}
const achKey = a => a.grp+'|'+a.title;
function checkAch(silent){
  if(!onboarded() || !PLAN) return;
  const list = achievements(stats());
  if(state.profile.seen === undefined){
    state.profile.seen = list.filter(a=>a.done).map(achKey);
    persist('profile');
    return;
  }
  const seen = new Set(state.profile.seen);
  const fresh = list.filter(a=>a.done && !seen.has(achKey(a)));
  if(!fresh.length) return;
  state.profile.seen = state.profile.seen.concat(fresh.map(achKey));
  persist('profile');
  if(!silent) fresh.forEach(a=>achQueue.push(a));
}

  h += `<h2>Başarımlar <span class="hint" style="font-family:var(--body);font-weight:500">${done}/${ach.length}</span></h2>`;

/* ---------- etkileşim ---------- */
function touchDay(){ return getDay(date, true); }
function act(a, ds){
  if(a==='start'){ startOnboarding(); }
  else if(a==='opt'){ const v = ds.v; form[ds.k] = (v!=='' && !isNaN(v)) ? Number(v) : v; formErr = ''; }
  else if(a==='consent'){ form.consent = !form.consent; formErr = ''; }
  else if(a==='obnext'){ formErr = validateStep(); if(!formErr){ step++; window.scrollTo(0,0); } }
  else if(a==='obback'){ step = Math.max(0, step-1); formErr = ''; window.scrollTo(0,0); }
  else if(a==='finish'){ formErr = validateStep(); if(!formErr){ finishOnboarding(); window.scrollTo(0,0); } }
  else if(a==='cancelEdit'){ screen = null; }
  else if(a==='enter'){ screen = null; tab = 'bugun'; date = TODAY; menuDay = dow(TODAY); window.scrollTo(0,0); }
  else if(a==='edit'){ startOnboarding(); window.scrollTo(0,0); }
  else if(a==='tab'){ tab = ds.t; if(tab==='antrenman'){ const ti = trainFor(date); if(ti.idx>=0) wk = ti.idx; } window.scrollTo(0,0); }
  else if(a==='prev'){ date = addDays(date,-1); planPicker = false; }
  else if(a==='next'){ date = addDays(date,1); planPicker = false; }
  else if(a==='today'){ date = TODAY; planPicker = false; }
  else if(a==='meal'){
    const d = touchDay(); d.meals = d.meals || {};
    const i = ds.i; if(d.meals[i]) delete d.meals[i]; else d.meals[i] = true;
    persist('d_'+date);
  }
  else if(a==='water'){ const d = touchDay(); d.water = Math.max(0,(d.water||0)+Number(ds.n)); persist('d_'+date); }
  else if(a==='ackAch'){ achQueue.shift(); }
  else if(a==='mmode'){ menuMode = ds.v; }
  else if(a==='pickplan'){ planPicker = !planPicker; }
  else if(a==='setplan'){ const d = touchDay(); if(ds.v==='auto') delete d.plan; else d.plan = Number(ds.v); persist('d_'+date); planPicker = false; }
  else if(a==='swap'){
    const nx = addDays(date,1), x = trainFor(date), y = trainFor(nx);
    const d1 = touchDay(), d2 = getDay(nx,true);
    d1.plan = y.idx; d2.plan = x.idx; persist('d_'+date); persist('d_'+nx); planPicker = false;
  }
  else if(a==='mday'){ menuDay = Number(ds.i); }
  else if(a==='wk'){ wk = Number(ds.i); }
  else if(a==='gotowk'){ wk = Number(ds.i); tab = 'antrenman'; window.scrollTo(0,0); }
  else if(a==='how'){ howOpen = (howOpen===ds.slot) ? null : ds.slot; }
  else if(a==='exchg'){
    if(swapOpen===ds.slot){ swapOpen = null; }
    else { swapOpen = ds.slot; exDraft = (P().swaps && P().swaps[ds.slot]) || ''; }
  }
  else if(a==='exsave'){
    const nm = exDraft.replace(/\s+/g,' ').trim().slice(0,40);
    if(nm){ const p = P(); p.swaps = p.swaps || {}; p.swaps[ds.slot] = nm; persist('profile'); swapOpen = null; setStatus('Hareket değiştirildi: '+nm, false); }
  }
  else if(a==='exreset'){ const p = P(); if(p.swaps) delete p.swaps[ds.slot]; persist('profile'); swapOpen = null; }
  else if(a==='exclose'){ swapOpen = null; }
  else if(a==='avtog'){
    const p = P(); p.avoid = p.avoid || [];
    const i = p.avoid.indexOf(ds.k); if(i>=0) p.avoid.splice(i,1); else p.avoid.push(ds.k);
    p.mealPick = {}; persist('profile'); refreshPlan();
  }
  else if(a==='avsave'){
    const p = P(); p.avoidText = (avDraft!==null ? avDraft : (p.avoidText||'')).replace(/\s+/g,' ').trim().slice(0,120); avDraft = null;
    p.mealPick = {}; persist('profile'); refreshPlan(); setStatus('Beslenme tercihlerin kaydedildi.', false);
  }
  else if(a==='mpick'){
    const p = P(); p.mealPick = p.mealPick || {};
    p.mealPick[ds.key] = (Number(ds.idx)+1) % Number(ds.n); persist('profile'); refreshPlan();
  }
  else if(a==='xopen'){ xOpen = true; formErr = ''; }
  else if(a==='xclose'){ xOpen = false; formErr = ''; xReset(); }
  else if(a==='xpick'){ const f = FOODS[Number(ds.i)]; if(f){ xd.n = f[0]; xd.base = f; xd.m = '1'; xd.note = ''; xScale(); formErr = ''; } }
  else if(a==='xai'){ xAi(); return; }
  else if(a==='xq'){ xd.n = ds.n; xd.k = ds.k; xd.base = null; xd.note = ''; formErr = ''; }
  else if(a==='xadd'){
    const k = num(xd.k), nm = (xd.n||'').replace(/\s+/g,' ').trim().slice(0,40);
    if(!nm){ formErr = 'Ne yediğini yaz.'; }
    else if(k==null || k<=0 || k>5000){ formErr = 'Kaloriyi 1-5000 arasında yaz (tahmini olabilir).'; }
    else {
      const d = touchDay(); d.extra = d.extra || [];
      const o = {n:nm, k:Math.round(k)};
      ['p','c','f'].forEach(f=>{ const v = num(xd[f]); if(v>0 && v<=1000) o[f] = Math.round(v*10)/10; });
      d.extra.push(o); persist('d_'+date);
      xOpen = false; formErr = ''; xReset();
    }
  }
  else if(a==='xdel'){ const d = touchDay(); if(d.extra){ d.extra.splice(Number(ds.i),1); if(!d.extra.length) delete d.extra; persist('d_'+date); } }
  else if(a==='sok'){
    const r = setRec(ds.ex, Number(ds.tot)), i = Number(ds.i), x = r.s[i];
    if(x.ok){ x.ok = false; }
    else {
      if(!(x.kg>0)){
        let pk = 0; for(let j=i-1;j>=0;j--){ if(r.s[j] && r.s[j].kg>0){ pk = r.s[j].kg; break; } }
        if(!pk){ const l = lastLift(ds.ex, date); if(l) pk = l.kg; }
        if(pk) x.kg = pk;
      }
      x.ok = true;
    }
    syncLift(r); persist('d_'+date);
  }
  else if(a==='shop'){
    state.profile.shop = state.profile.shop || {};
    if(state.profile.shop[ds.n]) delete state.profile.shop[ds.n]; else state.profile.shop[ds.n] = true;
    persist('profile');
  }
  else if(a==='shopclear'){ state.profile.shop = {}; persist('profile'); }
  if(!screen) checkAch();
  render();
}
function onField(el){
  const f = el.dataset.field;
  if(f==='sk' || f==='sr'){ onSetField(el, true); return; }
  if(f==='exname'){ exDraft = el.value; return; }
  if(f==='avtext'){ avDraft = el.value; return; }
  if(f==='xm'){ xd.m = el.value; xScale(); render(); return; }
  if(['xn','xk','xp','xc','xf'].indexOf(f)>=0){ xd[f.slice(1)] = el.value; if(f==='xn') updateSugg(); return; }
  if(f==='lift'){
    const d = touchDay(); d.lifts = d.lifts || {};
    const r = d.lifts[el.dataset.ex] = d.lifts[el.dataset.ex] || {};
    const v = num(el.value);
    if(v==null) delete r.kg; else r.kg = v;
  } else {
    const d = touchDay(); const v = num(el.value);
    if(v==null) delete d[f]; else d[f] = (f==='steps') ? Math.round(v) : v;
  }
  persist('d_'+date);
  el.blur();
  checkAch();
  render();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(t){ try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(_){}; act(t.dataset.act, t.dataset); }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t && t.dataset && t.dataset.field) onField(t);
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t && t.dataset && t.dataset.form){ form[t.dataset.form] = t.value; formErr = ''; }
  if(t && t.dataset && t.dataset.field==='exname') exDraft = t.value;
  if(t && t.dataset && t.dataset.field==='avtext') avDraft = t.value;
  if(t && t.dataset && ['xn','xk','xp','xc','xf'].indexOf(t.dataset.field)>=0){ xd[t.dataset.field.slice(1)] = t.value; if(t.dataset.field==='xn'){ if(xd.base && xd.base[0]!==t.value){ xd.base = null; } updateSugg(); } }
  if(t && t.dataset && (t.dataset.field==='sk' || t.dataset.field==='sr')) onSetField(t, false);
});

loadLocal();
if(!onboarded()) screen = 'welcome';
refreshPlan();
render();
initCloud();

</script>
